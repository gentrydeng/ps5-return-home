name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install host prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            make python3 gcc binutils dpkg-dev libffi8 libedit2 libz3-4 libxml2 libzstd1 ca-certificates
      - name: Prepare pinned toolchain
        run: python3 scripts/prepare.py
      - name: Run payload and package tests
        run: python3 -m unittest discover -s tests -v
      - name: Build and check the locked ELF digest
        run: sh scripts/build.sh
      - name: Package binary and corresponding source
        run: python3 scripts/package.py
      - name: Verify the packages
        run: python3 scripts/package.py --verify-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error
          retention-days: 30
  attest:
    needs: build
    if: github.repository == 'gentrydeng/ps5-return-home' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
